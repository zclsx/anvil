name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build Windows package
        run: npm run build:win

      - name: Verify Windows Claude Agent SDK binary
        shell: pwsh
        run: |
          $sdkBinary = "release/win-unpacked/resources/app.asar.unpacked/node_modules/@anthropic-ai/claude-agent-sdk-win32-x64"
          if (!(Test-Path $sdkBinary)) {
            throw "Missing Windows Claude Agent SDK binary: $sdkBinary"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anvil-windows
          path: |
            app/release/*.exe
            app/release/*.blockmap
            app/release/latest.yml
          if-no-files-found: error
